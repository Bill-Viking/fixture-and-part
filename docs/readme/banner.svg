<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">The Fixture and the Part</title>
  <desc id="d">Two steel rails with the amber part held between them, beside the title and subtitle of the essay.</desc>
  <rect width="1280" height="320" fill="#F4F5F7"/>
  <rect x="16.5" y="16.5" width="1247" height="287" fill="none" stroke="#DCDFE4" stroke-width="1"/>
  <g>
    <rect x="72" y="80" width="176" height="48" fill="none" stroke="#1E5AA8" stroke-width="2"/>
