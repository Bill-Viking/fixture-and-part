    <rect x="566" y="229" width="11" height="11" fill="#F2B705"/>
    <text x="585" y="239" fill="#7A5900">AMBER — the moving part</text>
    <rect x="810" y="229" width="11" height="11" fill="#2C7539"/>
    <text x="829" y="239" fill="#2C7539">GREEN — keys</text>
  </g>
  <rect x="992.5" y="246.5" width="271" height="57" fill="none" stroke="#DCDFE4" stroke-width="1"/>
  <g font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="0.5" fill="#585F6A">
