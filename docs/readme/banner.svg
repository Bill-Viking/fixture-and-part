  <text x="312" y="124" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#14161A">The Fixture and the <tspan fill="#7A5900">Part</tspan></text>
  <text font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#585F6A">
    <tspan x="314" y="170">How a language model thinks, how a brain remembers,</tspan>
    <tspan x="314" y="199">and why the honest comparison flatters neither.</tspan>
  </text>
  <g font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.5">
